<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>

<style>
body {
    margin: 0;
    background: #080a0f;
    color: white;
    font-family: Arial;
    text-align: center;
}

h1 {
    margin: 20px;
}

canvas {
    background: #11151e;
    border: 2px solid #705cff;
    max-width: 90vw;
}

p {
    color: #aaa;
}
</style>
</head>

<body>

<h1>🐍 Snake</h1>

<canvas id="game" width="400" height="400"></canvas>

<p>Use the arrow keys to move.</p>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

let snake = [
    {x:200,y:200}
];

let food = {
    x:100,
    y:100
};

let dx = 20;
let dy = 0;

let score = 0;


document.addEventListener(
    "keydown",
    changeDirection
);


function changeDirection(event) {

    if (
        event.key === "ArrowUp" &&
        dy === 0
    ) {
        dx = 0;
        dy = -20;
    }

    if (
        event.key === "ArrowDown" &&
        dy === 0
    ) {
        dx = 0;
        dy = 20;
    }

    if (
        event.key === "ArrowLeft" &&
        dx === 0
    ) {
        dx = -20;
        dy = 0;
    }

    if (
        event.key === "ArrowRight" &&
        dx === 0
    ) {
        dx = 20;
        dy = 0;
    }

}


function gameLoop() {

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };


    if (
        head.x < 0 ||
        head.x >= canvas.width ||
        head.y < 0 ||
        head.y >= canvas.height
    ) {

        alert("Game Over! Score: " + score);

        location.reload();

        return;
    }


    snake.unshift(head);


    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        food = {

            x:
            Math.floor(
                Math.random() * 20
            ) * 20,

            y:
            Math.floor(
                Math.random() * 20
            ) * 20

        };

    } else {

        snake.pop();

    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle = "#705cff";

    snake.forEach(part => {

        ctx.fillRect(
            part.x,
            part.y,
            18,
            18
        );

    });


    ctx.fillStyle = "#ff4d6d";

    ctx.fillRect(
        food.x,
        food.y,
        18,
        18
    );

}


setInterval(
    gameLoop,
    100
);

</script>

</body>
</html>
